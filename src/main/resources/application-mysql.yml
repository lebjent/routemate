spring:
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: false

  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/common,classpath:db/migration/mysql

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/routemate?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:routemate}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}

server:
  port: 8090

logging:
  level:
    org.hibernate.SQL: ${APP_SQL_LOG_LEVEL:DEBUG}
    org.hibernate.orm.jdbc.bind: ${APP_SQL_BIND_LOG_LEVEL:TRACE}
