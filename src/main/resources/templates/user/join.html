<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/header :: globalHeader('회원가입')}"></th:block>
    <!-- Daum 우편번호 서비스 API -->
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <style>
        /* ====== 커스텀 달력 팔업 ====== */
        .rm-calendar {
            position: absolute;
            top: calc(100% + 8px);
            left: 0; right: 0;
            z-index: 200;
            background: rgba(13, 17, 35, 0.97);
            border: 1px solid rgba(99,102,241,0.25);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
            backdrop-filter: blur(24px);
            opacity: 0;
            transform: translateY(-8px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .rm-calendar.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }
        .rm-cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .rm-cal-nav {
            width: 32px; height: 32px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #9ca3af;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, color 0.15s;
            font-size: 13px;
        }
        .rm-cal-nav:hover { background: rgba(99,102,241,0.2); color: #a5b4fc; border-color: rgba(99,102,241,0.4); }
        .rm-cal-title {
            font-size: 14px;
            font-weight: 700;
            color: #e2e8f0;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            transition: background 0.15s;
            display: flex; align-items: center; gap: 6px;
        }
        .rm-cal-title:hover { background: rgba(255,255,255,0.06); }
        .rm-cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            margin-bottom: 8px;
        }
        .rm-cal-weekday {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #4b5563;
            padding: 4px 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .rm-cal-weekday:first-child { color: #f87171; }
        .rm-cal-weekday:last-child  { color: #60a5fa; }
        .rm-cal-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }
        .rm-cal-day {
            aspect-ratio: 1;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            border-radius: 10px;
            cursor: pointer;
            color: #d1d5db;
            transition: background 0.15s, color 0.15s, transform 0.1s;
            position: relative;
            font-weight: 500;
        }
        .rm-cal-day:hover:not(.disabled):not(.other-month) {
            background: rgba(99,102,241,0.18);
            color: #a5b4fc;
            transform: scale(1.08);
        }
        .rm-cal-day.other-month { color: rgba(255,255,255,0.15); cursor: default; }
        .rm-cal-day.today {
            color: #818cf8;
            font-weight: 700;
        }
        .rm-cal-day.today::after {
            content: '';
            position: absolute;
            bottom: 5px;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: #6366f1;
        }
        .rm-cal-day.selected {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(99,102,241,0.45);
            transform: scale(1.08);
        }
        .rm-cal-day.selected::after { display: none; }
        .rm-cal-day.disabled { color: rgba(255,255,255,0.12); cursor: not-allowed; pointer-events: none; }
        /* 연도 선택 그리드 */
        .rm-year-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
        }
        .rm-year-item {
            padding: 8px 4px;
            text-align: center;
            font-size: 13px;
            border-radius: 10px;
            cursor: pointer;
            color: #9ca3af;
            transition: background 0.15s, color 0.15s;
        }
        .rm-year-item:hover { background: rgba(99,102,241,0.18); color: #a5b4fc; }
        .rm-year-item.active { background: linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; font-weight:700; }
        /* 월 선택 그리드 */
        .rm-month-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .rm-month-item {
            padding: 10px 4px;
            text-align: center;
            font-size: 12px;
            border-radius: 10px;
            cursor: pointer;
            color: #9ca3af;
            transition: background 0.15s, color 0.15s;
        }
        .rm-month-item:hover { background: rgba(99,102,241,0.18); color: #a5b4fc; }
        .rm-month-item.active { background: linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; font-weight:700; }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between relative">

<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>

<nav class="w-full max-w-7xl mx-auto px-6 py-5 z-50 relative">

        <span class="text-brand-primary"><i class="fa-solid fa-map-location-dot"></i></span>
        <span>Route<span class="text-indigo-400">Mate</span></span>

</nav>

        <form id="joinForm" onsubmit="submitJoinForm(event)" class="space-y-5">

            </div>

            <div>

                    <input type="text" id="userNicknm" required

            <div>

                    <input type="password" id="userPwd" required autocomplete="new-password"

                </div>

                <!-- 비밀번호 보안 등급 인디케이터 -->
                <div id="pwdStrengthWrap" class="mt-2.5 hidden">
                    <div class="flex gap-1.5 mb-1.5">
                        <div id="bar1" class="h-1.5 flex-1 rounded-full bg-white/10 transition-all duration-300"></div>
                        <div id="bar2" class="h-1.5 flex-1 rounded-full bg-white/10 transition-all duration-300"></div>
                        <div id="bar3" class="h-1.5 flex-1 rounded-full bg-white/10 transition-all duration-300"></div>
                        <div id="bar4" class="h-1.5 flex-1 rounded-full bg-white/10 transition-all duration-300"></div>
                        <div id="bar5" class="h-1.5 flex-1 rounded-full bg-white/10 transition-all duration-300"></div>
                    </div>
                    <div class="flex justify-between items-center">

            <div>
                <label for="userPwdCheck" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">비밀번호 확인</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500"><i class="fa-solid fa-shield-halved"></i></span>
                    <input type="password" id="userPwdCheck" required autocomplete="new-password"
                           class="w-full bg-black/40 border border-white/10 rounded-xl pl-11 pr-4 py-3.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition"
                           placeholder="••••••••">
                </div>
            </div>

            <div>
                <label for="userBirth" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">생년월일</label>
                <div class="relative" id="birthPickerWrap">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500 z-10 pointer-events-none">
                        <i class="fa-regular fa-calendar"></i>
                    </span>
                    <input type="text" id="userBirth" required readonly

                           class="w-full bg-black/40 border border-white/10 rounded-xl pl-11 pr-10 py-3.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition cursor-pointer"
                           placeholder="달력에서 날짜를 선택해 주세요">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-500 pointer-events-none">
                        <i class="fa-solid fa-chevron-down text-xs" id="calChevron" style="transition: transform 0.2s"></i>
                    </span>
                    <!-- 커스텀 달력 팔업 -->
                    <div id="rmCalendar" class="rm-calendar">
                        <!-- 헤더: 네비게이션 -->
                        <div class="rm-cal-header" id="calHeader">
                            <button type="button" class="rm-cal-nav" onclick="calMove(-1)">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <span class="rm-cal-title" onclick="toggleYearView()" id="calTitleBtn">
                                <span id="calTitle"></span>
                                <i class="fa-solid fa-chevron-down" style="font-size:10px; color:#6366f1;"></i>
                            </span>
                            <button type="button" class="rm-cal-nav" onclick="calMove(1)">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                        <!-- 요일 헤더 -->
                        <div class="rm-cal-weekdays" id="calWeekdays">
                            <div class="rm-cal-weekday">일</div>
                            <div class="rm-cal-weekday">월</div>
                            <div class="rm-cal-weekday">화</div>
                            <div class="rm-cal-weekday">수</div>
                            <div class="rm-cal-weekday">목</div>
                            <div class="rm-cal-weekday">금</div>
                            <div class="rm-cal-weekday">토</div>
                        </div>
                        <!-- 날짜 그리드 -->

                        <!-- 연도/월 선택 뷰 (toggle) -->
                        <div id="calYearView" style="display:none">

                            <div class="rm-year-grid" id="calYearGrid"></div>

                    </div>
                </div>
            </div>

            <div>
                <label for="userPhone" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">휴대폰 번호</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500"><i class="fa-solid fa-mobile-screen-button"></i></span>
                    <input type="tel" id="userPhone" required
                           class="w-full bg-black/40 border border-white/10 rounded-xl pl-11 pr-4 py-3.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition"
                           placeholder="010-1234-5678">
                </div>
            </div>

            <div>
                <label for="userZipcode" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">우편번호</label>
                <div class="flex gap-2">
                    <div class="relative flex-grow">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500"><i class="fa-solid fa-location-arrow"></i></span>
                        <input type="text" id="userZipcode" required readonly

                               placeholder="우편번호">
                    </div>
                    <button type="button" onclick="execDaumPostcode()"
                            class="px-4 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition shrink-0">
                        주소 검색
                    </button>
                </div>
            </div>

            <div>
                <label for="userAddr" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">기본 주소</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500"><i class="fa-solid fa-house"></i></span>
                    <input type="text" id="userAddr" required readonly
                           class="w-full bg-black/40 border border-white/10 rounded-xl pl-11 pr-4 py-3.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition"
                           placeholder="주소 검색 버튼을 눌러주세요">
                </div>
            </div>

            <div>
                <label for="userAddrDetail" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">상세 주소</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500"><i class="fa-solid fa-house-user"></i></span>
                    <input type="text" id="userAddrDetail" required
                           class="w-full bg-black/40 border border-white/10 rounded-xl pl-11 pr-4 py-3.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition"
                           placeholder="101동 1004호">
                </div>
            </div>

            <button type="submit" class="w-full theme-btn-primary py-4 mt-4 font-semibold text-sm">
                가입 완료하기
            </button>
        </form>

        <div class="text-center mt-6 pt-6 border-t border-white/5 text-xs text-gray-400">
            이미 계정이 있으신가요? <a href="#" class="text-brand-primary hover:underline font-medium ml-1">로그인하기</a>
        </div>

    </div>
</main>

<footer class="w-full max-w-7xl mx-auto px-6 py-6 text-center text-xs text-gray-600 z-10 relative">
    &copy; 2026 RouteMate. All Rights Reserved.
</footer>

<script>
    async function submitJoinForm(event) {
        event.preventDefault(); // 기본 폼 전송 이벤트 차단

        const email = document.getElementById('userEmail').value;
        const nicknm = document.getElementById('userNicknm').value;
        const pwd = document.getElementById('userPwd').value;
        const pwdCheck = document.getElementById('userPwdCheck').value;
        const birth = document.getElementById('userBirth').value;
        const phone = document.getElementById('userPhone').value;
        const zipcode = document.getElementById('userZipcode').value;
        const addr = document.getElementById('userAddr').value;
        const addrDetail = document.getElementById('userAddrDetail').value;

        // 프론트엔드 1차 패스워드 일치 검증
        if (pwd !== pwdCheck) {
            alert('입력하신 비밀번호가 서로 일치하지 않습니다.');
            return;
        }

        // 요청 데이터 DTO 구조 매핑
        const joinData = {
            userEmail: email,
            userNicknm: nicknm,
            userPwd: pwd,
            userPwdCheck: pwdCheck,
            userPhone: phone,
            userZipcode: zipcode,
            userAddr: addr,
            userAddrDetail: addrDetail,
            userBirth: birth
        };

        try {
            // 아까 포스트맨으로 쐈던 백엔드 가입 API 호출
            const response = await fetch('/api/user/join', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(joinData)
            });

            const message = await response.text();

            if (response.ok) {
                // 가입 성공 시 알림 후 메인 화면으로 이동
                alert(message);
                window.location.href = '/';
            } else {
                // 백엔드 비즈니스 에러 발생 시 예외 메시지 출력 (중복 이메일 등)
                alert('회원가입 실패: ' + message);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('서버 통신 중 에러가 발생했습니다.');
        }
    }

    function checkPasswordStrength(pwd) {
        const wrap = document.getElementById('pwdStrengthWrap');
        const text = document.getElementById('pwdStrengthText');
        const hint = document.getElementById('pwdStrengthHint');
        const bars = [1,2,3,4,5].map(i => document.getElementById('bar' + i));

        if (!pwd) {
            wrap.classList.add('hidden');
            bars.forEach(b => b.style.backgroundColor = '');
            return;
        }

        wrap.classList.remove('hidden');

        let score = 0;
        if (pwd.length >= 8)  score++;
        if (pwd.length >= 12) score++;
        if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
        if (/[0-9]/.test(pwd)) score++;
        if (/[^a-zA-Z0-9]/.test(pwd)) score++;

        const levels = [
            { color: '#ef4444', label: '매우 약함 🔴', hint: '8자 이상 입력해 주세요' },
            { color: '#f97316', label: '약함 🟠',     hint: '대소문자를 더해보세요' },
            { color: '#eab308', label: '보통 🟡',     hint: '숫자 또는 특수문자를 더해보세요' },
            { color: '#22c55e', label: '강함 🟢',     hint: '조금만 더 입력하면 완벽해요!' },
            { color: '#6366f1', label: '매우 강함 💎', hint: '완벽한 비밀번호입니다!' },
        ];

        const idx = Math.max(0, Math.min(score - 1, 4));
        const level = levels[idx];

        bars.forEach((bar, i) => {
            bar.style.backgroundColor = i <= idx ? level.color : '';
            bar.style.opacity = i <= idx ? '1' : '0.15';
        });

        text.textContent = '보안 등급: ' + level.label;
        text.style.color = level.color;
        hint.textContent = level.hint;
    }

    function execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                var roadAddr = data.roadAddress; // 도로명 주소 변수
                var extraRoadAddr = ''; // 참고 항목 변수

                if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                    extraRoadAddr += data.bname;
                }
                if(data.buildingName !== '' && data.apartment === 'Y'){
                   extraRoadAddr += (extraRoadAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                }
                if(extraRoadAddr !== ''){
                    extraRoadAddr = ' (' + extraRoadAddr + ')';
                }

                document.getElementById('userZipcode').value = data.zonecode;
                document.getElementById("userAddr").value = roadAddr + extraRoadAddr;
                
                document.getElementById("userAddrDetail").focus();
            }
        }).open();
    }

    // ===== 커스텀 달력 =====
    const KO_MONTHS = ['일월','이월','삼월','사월','오월','유월','칠월','팔월','구월','십월','십일월','십이월'];
    let calYear, calMonth, calSelDate, calOpen = false, calYearViewOpen = false;

    function initCal() {
        const now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth();
        calSelDate = null;
        renderCal();
    }

    function toggleCalendar() {
        const cal = document.getElementById('rmCalendar');
        const chev = document.getElementById('calChevron');
        calOpen = !calOpen;
        if (calOpen) {
            cal.classList.add('open');
            chev.style.transform = 'rotate(180deg)';
        } else {
            cal.classList.remove('open');
            chev.style.transform = '';
            calYearViewOpen = false;
            document.getElementById('calYearView').style.display = 'none';
            document.getElementById('calWeekdays').style.display = 'grid';
            document.getElementById('calDays').style.display = 'grid';
        }
    }

    function calMove(dir) {
        if (calYearViewOpen) return;
        calMonth += dir;
        if (calMonth > 11) { calMonth = 0; calYear++; }
        if (calMonth < 0)  { calMonth = 11; calYear--; }
        renderCal();
    }

    function renderCal() {
        document.getElementById('calTitle').textContent = calYear + '년 ' + KO_MONTHS[calMonth];
        const grid  = document.getElementById('calDays');
        const today = new Date();
        today.setHours(0,0,0,0);
        const firstDay   = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        const prevDays   = new Date(calYear, calMonth, 0).getDate();
        let html = '';

        // 이전 달 날짜 (other-month)
        for (let i = firstDay - 1; i >= 0; i--) {
            html += `<div class="rm-cal-day other-month">${prevDays - i}</div>`;
        }
        // 이번 달
        for (let d = 1; d <= daysInMonth; d++) {
            const thisDate = new Date(calYear, calMonth, d);
            thisDate.setHours(0,0,0,0);
            const isToday    = thisDate.getTime() === today.getTime();
            const isDisabled = thisDate > today;
            const isSel      = calSelDate && thisDate.getTime() === calSelDate.getTime();
            let cls = 'rm-cal-day';
            if (isToday)    cls += ' today';
            if (isDisabled) cls += ' disabled';
            if (isSel)      cls += ' selected';
            html += `<div class="${cls}" onclick="selectDate(${calYear},${calMonth},${d})">${d}</div>`;
        }
        // 다음 달
        const remaining = 42 - firstDay - daysInMonth;
        for (let d = 1; d <= remaining; d++) {
            html += `<div class="rm-cal-day other-month">${d}</div>`;
        }
        grid.innerHTML = html;
    }

    function selectDate(y, m, d) {
        calSelDate = new Date(y, m, d);
        const mm = String(m + 1).padStart(2, '0');
        const dd = String(d).padStart(2, '0');
        document.getElementById('userBirth').value = `${y}-${mm}-${dd}`;
        toggleCalendar();
        renderCal();
    }

    function toggleYearView() {
        calYearViewOpen = !calYearViewOpen;
        const yv = document.getElementById('calYearView');
        const wd = document.getElementById('calWeekdays');
        const dg = document.getElementById('calDays');
        if (calYearViewOpen) {
            yv.style.display = 'block';
            wd.style.display = 'none';
            dg.style.display = 'none';
            renderYearView();
        } else {
            yv.style.display = 'none';
            wd.style.display = 'grid';
            dg.style.display = 'grid';
        }
    }

    function renderYearView() {
        // 월 그리드
        let mHtml = '';
        KO_MONTHS.forEach((mn, i) => {
            const active = i === calMonth ? ' active' : '';
            mHtml += `<div class="rm-month-item${active}" onclick="selectMonth(${i})">${mn}</div>`;
        });
        document.getElementById('calMonthGrid').innerHTML = mHtml;
        // 연도 그리드 (1924 ~ 올해)
        const now = new Date().getFullYear();
        let yHtml = '';
        for (let y = now; y >= 1924; y--) {
            const active = y === calYear ? ' active' : '';
            yHtml += `<div class="rm-year-item${active}" onclick="selectYear(${y})">${y}</div>`;
        }
        document.getElementById('calYearGrid').innerHTML = yHtml;
        // 선택된 연도로 스크롤
        const activeEl = document.querySelector('.rm-year-item.active');
        if (activeEl) activeEl.scrollIntoView({ block: 'center' });
    }

    function selectMonth(m) {
        calMonth = m;
        calYearViewOpen = false;
        document.getElementById('calYearView').style.display = 'none';
        document.getElementById('calWeekdays').style.display = 'grid';
        document.getElementById('calDays').style.display = 'grid';
        renderCal();
    }

    function selectYear(y) {
        calYear = y;
        renderYearView(); // 연도만 바꾸고 월 선택 대기
    }

    // 외부 클릭 시 닫기
    document.addEventListener('click', function(e) {
        const wrap = document.getElementById('birthPickerWrap');
        if (calOpen && wrap && !wrap.contains(e.target)) {
            toggleCalendar();
        }
    });

    document.addEventListener('DOMContentLoaded', initCal);
</script>
</body>
</html>
