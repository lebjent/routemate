<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/header :: globalHeader('RouteMate — 로그인')}"></th:block>
</head>
<body class="min-h-screen flex flex-col justify-between bg-brand-base text-gray-100 relative overflow-hidden">

<nav th:replace="~{common/header :: globalNav}"></nav>
<main class="flex-grow flex items-center justify-center px-6 relative z-10 py-12">
    <div class="theme-glass-card w-full max-w-md md:p-10 shadow-2xl relative border-white/[0.05]">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-white tracking-tight mb-2">다시 여정을 잇다</h2>
            <p class="text-sm text-gray-400 font-light">전 세계 스마트 동선 플래너, RouteMate 로그인</p>
        </div>

        <form th:action="@{/login}" method="POST" class="space-y-6">

            <div class="space-y-2">
                <label for="username" class="text-xs font-semibold text-gray-400 uppercase tracking-wider block">이메일 주소</label>
                <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500">
                            <i class="fa-solid fa-envelope text-sm"></i>
                        </span>
                    <input type="email" id="username" name="username" required
                           placeholder="example@routemate.com"
                           class="w-full bg-black/40 border border-gray-800 rounded-xl pl-11 pr-4 py-3.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-300">
                </div>
            </div>

            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label for="password" class="text-xs font-semibold text-gray-400 uppercase tracking-wider block">비밀번호</label>
                    <a href="#" class="text-xs text-indigo-400 hover:text-indigo-300 transition font-light">비밀번호 재설정</a>
                </div>
                <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </span>
                    <input type="password" id="password" name="password" required
                           placeholder="••••••••"
                           class="w-full bg-black/40 border border-gray-800 rounded-xl pl-11 pr-4 py-3.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-300">
                </div>
            </div>

            <button type="submit" class="w-full theme-btn-primary py-4 mt-2 text-base font-semibold tracking-wide">
                내 여정 불러오기
                <i class="fa-solid fa-right-to-bracket ml-1"></i>
            </button>
        </form>

        <div class="text-center mt-8 pt-6 border-t border-gray-800/60 text-sm">
            <span class="text-gray-500 font-light">아직 계정이 없으신가요?</span>
            <a th:href="@{/join}" class="text-indigo-400 hover:text-indigo-300 font-medium ml-1 transition underline underline-offset-4">
                지금 회원가입하기
            </a>
        </div>

    </div>
</main>

</body>
</html>
