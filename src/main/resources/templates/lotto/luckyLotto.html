<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RouteMate - 행운의 로또</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background-color: #f8f9fa; padding-top: 50px; }
        .lotto-box { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .ball-container { display: flex; justify-content: center; gap: 15px; margin: 30px 0; }

        /* 로또 공 공통 스타일 */
        .ball {
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white; font-size: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.3), 2px 2px 5px rgba(0,0,0,0.2);
        }

        /* 한국 로또 공식 색상 기준 조건별 CSS */
        .bg-yellow { background-color: #fbc400; } /* 1~10 */
        .bg-blue   { background-color: #69c8f2; } /* 11~20 */
        .bg-red    { background-color: #ff7272; } /* 21~30 */
        .bg-gray   { background-color: #aaa; }    /* 31~40 */
        .bg-green  { background-color: #b0d840; } /* 41~45 */

        button { padding: 12px 24px; font-size: 16px; font-weight: bold; background-color: #4e73df; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #2e59d9; }
    </style>
</head>
<body>

<div class="lotto-box">
    <h2>🎰 RouteMate 행운의 번호 🎰</h2>
    <p>이번 주 대박을 기원합니다!</p>

    <div class="ball-container">
        <div th:each="num : ${lottoNumbers}"
             class="ball"
             th:classappend="${num <= 10} ? 'bg-yellow' : (${num <= 20} ? 'bg-blue' : (${num <= 30} ? 'bg-red' : (${num <= 40} ? 'bg-gray' : 'bg-green')))"
             th:text="${num}">
            0
        </div>
    </div>

    <button onclick="location.reload()">새로 뽑기</button>
</div>

</body>
</html>
