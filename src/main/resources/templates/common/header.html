<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="globalHeader(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">RouteMate</title>

    <script th:src="@{/js/common/tailwindcss.3.4.17.js}"></script>
    <link rel="stylesheet" th:href="@{/css/common/all.min.css}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            base: '#0B0F19',
                            primary: '#6366F1'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0F19; font-family: 'Pretendard', sans-serif; min-height: screen; }
        .theme-gradient-text { background: linear-gradient(135deg, #FFF 30%, #A5B4FC 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .theme-glass-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border-radius: 24px; padding: 2rem; }
        .theme-btn-primary { background: #6366F1; color: white; border-radius: 16px; font-weight: 600; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3); transition: all 0.3s; display: inline-flex; items-center; justify-content: center; gap: 0.5rem; }
        .theme-btn-primary:hover { background: #4F46E5; transform: translateY(-1px); }
    </style>
</head>

<body>
<nav th:fragment="globalNav" class="w-full max-w-7xl mx-auto px-6 py-5 flex justify-between items-center z-50 relative">
    <a th:href="@{/}" class="text-2xl font-bold tracking-tight flex items-center gap-2 cursor-pointer">
        <span class="text-brand-primary"><i class="fa-solid fa-map-location-dot"></i></span>
        <span>Route<span class="text-indigo-400">Mate</span></span>
    </a>
    <div class="flex items-center gap-6">
        <a href="#" class="text-sm text-gray-400 hover:text-white transition hidden md:block">탐색하기</a>
        <a href="#" class="text-sm text-gray-400 hover:text-white transition hidden md:block">여행 피드</a>
        <a th:href="@{/login}" class="text-sm text-gray-300 hover:text-indigo-400 font-medium transition">로그인</a>
        <a th:href="@{/join}" class="text-sm bg-brand-primary hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-semibold shadow-lg shadow-indigo-600/20 transition duration-300">
            시작하기
        </a>
    </div>
</nav>

<footer th:fragment="globalFooter" class="w-full max-w-7xl mx-auto px-6 py-8 border-t border-gray-800/60 flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-gray-500 z-10 relative">
    <div>&copy; 2026 RouteMate. Next-Generation Global Journey Planner.</div>
    <div class="flex gap-4 text-gray-600">
        <a href="#" class="hover:text-gray-400 transition">이용약관</a>
        <a href="#" class="hover:text-gray-400 transition">개인정보처리방침</a>
        <a href="#" class="hover:text-gray-400 transition">고객센터</a>
    </div>
</footer>
</body>
</html>
