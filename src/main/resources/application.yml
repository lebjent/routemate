spring:
  application:
    name: routemate

  thymeleaf:
    cache: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

  mvc:
    problemdetails:
      enabled: true

  cache:
    type: caffeine
    cache-names: homeData,destinationCountries,destinationRegions
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1m

app:
  lotto:
    history:
      source-url: ${LOTTO_HISTORY_SOURCE_URL:https://www.dhlottery.co.kr/lt645/selectPstLt645InfoNew.do}
      refresh-interval: ${LOTTO_HISTORY_REFRESH_INTERVAL:12h}
      top-number-count: ${LOTTO_HISTORY_TOP_NUMBER_COUNT:15}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,metrics,prometheus
  endpoint:
    health:
      show-details: never
  observations:
    key-values:
      application: ${spring.application.name}

resilience4j:
  retry:
    instances:
      lotto-history:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - org.springframework.web.client.RestClientException

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
  level:
    com.trip.routemate.common.logging: INFO
