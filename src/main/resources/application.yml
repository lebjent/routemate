spring:
  application:
    name: routemate

  thymeleaf:
    cache: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

  mvc:
    problemdetails:
      enabled: true

  threads:
    virtual:
      # Tomcat 요청 처리를 Java 21 가상 스레드로 전환합니다.
      # 외부 로또 API처럼 응답 대기가 긴 블로킹 I/O에 특히 효과적입니다.
      enabled: true

  cache:
    type: caffeine
    cache-names: homeData,destinationCountries,destinationRegions
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1m

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  auth:
    # 이메일 소유권 검증이 없는 개발용 재설정 기능은 기본적으로 차단한다.
    password-reset-enabled: ${APP_PASSWORD_RESET_ENABLED:false}
  parallel:
    # 외부 API 호출 등 공통 병렬 작업의 기본 동시 실행 수입니다.
    max-threads: ${PARALLEL_MAX_THREADS:5}

  storage:
    # 공통 저장 루트입니다. 다른 PC는 LOCAL_STORAGE_ROOT 환경 변수로 경로를 변경할 수 있습니다.
    root-directory: ${LOCAL_STORAGE_ROOT:${user.home}/study/nas}
    # 도메인·업로드 계정별 폴더 안에서 yyyy/MM/dd 단위로 파일을 분리합니다.
    option-product-directory: optionProduct
    travel-plan-directory: travelPlan
    # 신규 이미지는 TB_STORED_IMAGE에 상대 경로를 저장합니다. 아래 URL은 기존 업로드 호환용입니다.
    option-product-url-prefix: /uploads/optionProduct
    travel-plan-url-prefix: /uploads/travelPlan

  lotto:
    history:
      source-url: ${LOTTO_HISTORY_SOURCE_URL:https://www.dhlottery.co.kr/lt645/selectPstLt645InfoNew.do}
      refresh-interval: ${LOTTO_HISTORY_REFRESH_INTERVAL:12h}
      top-number-count: ${LOTTO_HISTORY_TOP_NUMBER_COUNT:15}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,metrics,prometheus
  endpoint:
    health:
      show-details: never
  observations:
    key-values:
      application: ${spring.application.name}

resilience4j:
  retry:
    instances:
      lotto-history:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - org.springframework.web.client.RestClientException

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
  level:
    com.trip.routemate.common.logging: INFO
