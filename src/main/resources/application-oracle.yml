spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration/common,classpath:db/migration/oracle

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/ORCL}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${SPRING_DATASOURCE_USERNAME:routemate}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}

server:
  port: 8090
